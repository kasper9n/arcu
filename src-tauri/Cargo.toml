[package]
name = "arcu"
description = "Spotlight alternative"
version = "0.1.0"
edition = "2018"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "1.0.0-beta.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.0.0-beta.1",features = ["api-all", "system-tray", "menu"] }
tao = "0.2.3"
# tauri = { git = "https://github.com/tauri-apps/tauri", rev = "b6b4128", features = ["api-all"] }
cpc = "1.5.0"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.dev]
# speeds up incremental builds a lot. Should be default in a new Rust
# version: https://github.com/rust-lang/cargo/pull/9298
# https://jakedeichert.com/blog/reducing-rust-incremental-compilation-times-on-macos-by-70-percent/
split-debuginfo = "unpacked"
