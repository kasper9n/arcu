[package]
name = "arcu"
version = "0.1.0"
description = "Spotlight alternative"
default-run = "arcu"
edition = "2018"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "1.0.0-rc.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# tauri = { version = "1.0.0-beta.8",features = ["api-all", "system-tray"] }
tauri = { git = "https://github.com/probablykasper/tauri", branch = "mac-app-hide", features = ["global-shortcut-all", "shell-open", "system-tray"] }
cpc = "1.5.0"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
