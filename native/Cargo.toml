[package]
name = "arcu"
version = "0.1.0"
authors = ["Kasper <kasperkh.kh@gmail.com>"]
license = "MIT"
build = "build.rs"
exclude = ["artifacts.json", "index.node"]
edition = "2018"

[lib]
name = "arcu"
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "1.0.1"

[dependencies]
napi = { version = "1.1.3", features = ["napi4"] }
napi-derive = "1.0.0"
cpc = "1.4.2"

[dependencies.rustbreak]
version = "2.0.0-rc3"
features = ["yaml_enc"]
